org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

# 本机专属配置请放【用户级】gradle.properties（~/.gradle/gradle.properties，不进仓库），例如：
#   localIdePath=C:/Program Files/JetBrains/IntelliJ IDEA   # 指向本机 IDEA，避免下载整个平台
#   systemProp.https.proxyHost=127.0.0.1                    # 需要代理才能拉依赖时
#   systemProp.https.proxyPort=7890
# 项目级同名属性会覆盖用户级，所以这里不要写死任何机器相关的值。
